<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quechua en 30 días</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#1f2421;--mut:#6b6f6a;--line:#eadfcd;--verde:#0f7b4f;--rojo:#c8372d;--oro:#d99a1e;--b:#b4532a;--az:#185FA5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{height:7px;background:linear-gradient(90deg,#d62828 0 14.3%,#f77f00 14.3% 28.6%,#fcbf49 28.6% 42.9%,#fff 42.9% 57.1%,#2a9d43 57.1% 71.4%,#1d6fb8 71.4% 85.7%,#6a3d9a 85.7%)}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:Fraunces,serif;font-size:2rem;margin:10px 0 4px}
h2{font-family:Fraunces,serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 16px;line-height:1.5}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--verde);transition:.4s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.g{background:var(--verde);color:#fff;border-color:var(--verde)}
.btn.sm{padding:5px 9px;font-size:.85rem}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lvl{margin:22px 0 8px;display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;position:relative;border-top:4px solid var(--c)}
.day:hover{transform:translateY(-2px);box-shadow:0 4px 14px #0001}
.day b{font-family:Fraunces,serif;font-size:1.3rem}
.day small{display:block;color:var(--mut);margin-top:3px}
.day .ok{position:absolute;top:8px;right:10px;color:var(--verde);font-weight:700}
.day.locked{opacity:.55;background:#f4f1ea}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.w{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.w .it{font-weight:600}.w .es{color:var(--mut);font-size:.88rem}
.spk{border:none;background:#f1ece2;border-radius:8px;cursor:pointer;padding:6px 8px;font-size:1rem}
.spk:hover{background:#e6dfd0}
.note{background:#fff8e6;border-left:4px solid var(--oro);padding:10px 12px;border-radius:0;font-size:.95rem;line-height:1.55}
.cult{background:#f3f8f5;border-left:4px solid var(--verde);padding:10px 12px;border-radius:0;line-height:1.55}
table{width:100%;border-collapse:collapse}
td{padding:8px;border-bottom:1px solid var(--line)}
td:first-child{color:var(--mut);width:120px}
.big{font-family:Fraunces,serif;font-size:2.1rem;text-align:center;margin:14px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font:inherit;text-align:left}
.opt.ok{background:#e3f4ea;border-color:var(--verde)}.opt.bad{background:#fbe5e2;border-color:var(--rojo)}
input[type=text],input[type=password]{width:100%;padding:12px;font:inherit;font-size:1.1rem;border:1px solid var(--line);border-radius:10px}
select{padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.fb{margin-top:10px;font-weight:500;min-height:1.4em}
.fb.ok{color:var(--verde)}.fb.bad{color:var(--rojo)}
.mut{color:var(--mut)}
.score{font-weight:600}
.pr{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;color:var(--b);font-weight:400}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--b);font-weight:600;margin:16px 0 0}
.blk{margin-top:30px;scroll-margin-top:60px}
.sec{font-family:Fraunces,serif;font-weight:600;font-size:1.4rem;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec i{color:var(--b)}
.sec small{font-family:Inter,sans-serif;font-style:normal;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-left:6px}
.prose{line-height:1.7;max-width:72ch}.prose p{margin:0 0 12px}
.tblgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 14px}
.cap{text-align:left;padding:10px 12px 4px;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.th{text-align:left;padding:8px;color:var(--mut);font-size:.8rem;font-weight:600}
.m0{color:var(--ink);font-weight:600}.m1{color:#b4532a;font-weight:600}.m2{color:#0f7b4f;font-weight:600}.m3{color:#185FA5;font-weight:600}.md{color:#c4b59c;margin:0 1px;font-weight:400}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:1.3rem;cursor:pointer;z-index:20;box-shadow:0 3px 10px #0003}
.idx{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:210px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;z-index:20;box-shadow:0 6px 20px #0002;display:flex;flex-direction:column}
.idx[hidden]{display:none}
.idx button{border:none;background:none;text-align:left;padding:9px 12px;border-radius:9px;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
.idx button.on{background:#e3f4ea;color:var(--verde);font-weight:600}
.idx .up{border-top:1px solid var(--line);border-radius:0;color:var(--mut)}
.rule{border-radius:10px;padding:10px 12px;margin:8px 0}
.rule.v{background:#e3f4ea;color:#0f5c3b}.rule.a{background:#fff3d6;color:#7a5200}
.rule small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.rule div{font-size:1rem;margin-top:3px}
.lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:16px 0 6px}
.sndt{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sr{display:grid;grid-template-columns:70px 1fr 44px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.sr.hd{background:#f1ece2;color:var(--mut);font-size:.8rem;border-top:none}
.clave{border-radius:10px;padding:10px 12px;margin:8px 0}
.clave small{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.clave div{margin-top:3px;line-height:1.5}.clave .cx{display:flex;align-items:center;gap:8px;font-style:italic;font-size:.92rem}
.clave.v{background:#e3f4ea;color:#0f5c3b}.clave.b{background:#e6eef9;color:#1d4a80}.clave.a{background:#fff3d6;color:#7a5200}
.hint{font-size:.85rem;color:var(--mut);margin:2px 0 10px}
.ej{display:inline-block;border:1px dashed #9a958a;border-radius:6px;padding:1px 9px;color:var(--ink);background:#faf8f3;font-style:normal}
body.typing .fab,body.typing .idx{display:none!important}
.ev{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.ev button{padding:11px 6px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.ev .ok{background:#e3f4ea;color:#0f5c3b;border:1px solid #9fd3b6}.ev .mid{background:#fff3d6;color:#7a5200;border:1px solid #f0cf86}.ev .bad{background:#fbe5e2;color:#9b2a22;border:1px solid #f0b3ac}
.hard{display:inline-block;background:#fff3d6;color:#7a5200;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600;margin:6px 0 0}
.micb{width:100%;height:52px;border:none;border-radius:26px;background:var(--b);color:#fff;font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer;transition:background .2s}
.micb.on{background:#a32d2d;animation:pr 1.2s infinite}
@keyframes pr{0%{box-shadow:0 0 0 0 rgba(226,75,74,.55)}100%{box-shadow:0 0 0 14px rgba(226,75,74,0)}}
.wv{display:inline-flex;align-items:center;height:24px;margin-right:6px;vertical-align:middle}.wv i{display:inline-block;width:4px;margin:0 2px;border-radius:2px;background:#fff;animation:wv .9s ease-in-out infinite}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.45s}@keyframes wv{0%,100%{height:6px}50%{height:22px}}
.er{display:grid;grid-template-columns:28px 1fr 44px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}.er:first-child{border-top:none}
.er small.bad{color:var(--rojo)}
.chat{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.bb{max-width:82%;padding:8px 12px;border-radius:14px;line-height:1.4}.bb small{display:block;font-size:.72rem;color:var(--mut);font-weight:600}
.bb.other{align-self:flex-start;background:#f1ece2;border-bottom-left-radius:4px}
.bb.me{align-self:flex-end;border-bottom-right-radius:4px}.bb.me.ok{background:#e3f4ea;color:#0f5c3b}.bb.me.bad{background:#fbe5e2;color:#9b2a22}
.bb.turn{margin:6px 0 10px auto;border:1.5px dashed var(--verde);color:#0f5c3b;max-width:90%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{padding:5px 10px;border-radius:9px;font-weight:600;font-size:.95rem}.chip.ok{background:#e3f4ea;color:#0f5c3b}.chip.bad{background:#fbe5e2;color:#9b2a22}
.wres{margin-top:10px;text-align:left}.wres small{font-size:.72rem;letter-spacing:.06em;color:var(--mut);font-weight:600}
.rd{font-size:1.35rem;font-weight:600;color:var(--ink);margin:4px 0}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .card{max-width:400px;text-align:center}
@media(max-width:560px){.opts{grid-template-columns:1fr}h1{font-size:1.6rem}}
</style>
</head>
<body>
<header></header>
<div class="wrap" id="app"></div>
<script>
const PR=r=>[r+"ni",r+"nki",r+"n",r+"nchik",r+"yku",r+"nkichik",r+"nku"];
const PG=r=>PR(r+"chka");
const PS=r=>[r+"rqani",r+"rqanki",r+"rqa",r+"rqanchik",r+"rqayku",r+"rqankichik",r+"rqanku"];
const FU=r=>[r+"saq",r+"nki",r+"nqa",r+"sun",r+"saqku",r+"nkichik",r+"nqaku"];
const B=[
{t:"Saludos · Allillanchu?",g:"Saludar con respeto, responder cómo estás y despedirte.",
w:[["allillanchu?","¿estás bien? (así se saluda)"],["allillanmi","estoy bien"],["qamrí?","¿y tú?"],["sulpayki","gracias"],["arí","sí"],["manam","no"],["yaykumuy","pasa, entra"],["tiyaykuy","siéntate, por favor"],["paqarinkama","hasta mañana"],["tupananchikkama","hasta vernos"],["mamay","señora (lit. mi mamá)"],["taytay","señor (lit. mi papá)"]],
f:[["Allillanchu, mamay?","¿Está bien, señora? (hola)"],["Allillanmi, sulpayki.","Estoy bien, gracias."],["Imaynallam kachkanki, taytay?","¿Cómo está usted, señor?"],["Ñuqapas allillanmi kachkani.","Yo también estoy bien."],["Yaykumuy, tiyaykuy, mamay.","Pase, siéntese, señora."],["Paqarinkama, tupananchikkama, taytay!","¡Hasta mañana, hasta vernos, señor!"]],
v:["kay","ser / estar","Presente",PR("ka").map((x,i)=>i===4?"kayku":x)],
c:[["Allillanchu, Rosa?","¡Hola, Rosa! ¿Estás bien?"],["Allillanmi, sulpayki. Qamrí?","Estoy bien, gracias. ¿Y tú?"],["Ñuqapas allillanmi. Yaykumuy, tiyaykuy.","Yo también estoy bien. Pasa, siéntate."],["Sulpayki, mamay.","Gracias, señora."],["Paqarinkama, Rosa!","¡Hasta mañana, Rosa!"],["Tupananchikkama, mamay!","¡Hasta vernos, señora!"]],
n:"En quechua no hay un «hola» exacto: se saluda preguntando si la persona está bien: <i>Allillanchu?</i> (¿estás bien?).",
s:{i:"El quechua se lee casi como el castellano, pero tiene solo 3 vocales escritas: a, i, u.",r:[["Solo 3 vocales","a, i, u. Al lado de la q, la i suena «e» y la u suena «o» (lo verás pronto)","v"],["Acento","Casi siempre en la penúltima sílaba: a-lli-LLAN-chu","a"]],f:[["a","allillanchu"],["i","tiyaykuy"],["u","sulpayki"],["ll","allillanmi"],["y","yaykumuy"],["ch","allillanchu"]]},
gt:"Los saludos y el verbo kay (ser / estar)",gi:"<p><b>Paso 1 · Saludar es preguntar.</b> El saludo andino es una pregunta: <i>Allillanchu?</i> = ¿estás bien? Se responde <i>Allillanmi</i> = estoy bien.</p><p><b>Paso 2 · Devolver la pregunta.</b> <i>Qam·rí?</i> = ¿y tú? El pedacito <b>-rí</b> significa «¿y…?».</p><p><b>Paso 3 · Respeto.</b> A una persona mayor dile <i>mamay</i> (señora) o <i>taytay</i> (señor). Es como decir «mamita, papito» con cariño y respeto.</p><p><b>Paso 4 · Kay = ser y estar.</b> Igual que en inglés, un solo verbo sirve para los dos: <i>ñuqa kani</i> = yo soy / yo estoy.</p>",
tb:[{c:"Saludos del día",h:["Quechua","Español","Cuándo"],r:[["Allillanchu?","¿Estás bien? / hola","Al encontrarse"],["Allillanmi.","Estoy bien.","Para responder"],["Qam·rí?","¿Y tú?","Para devolver"],["Sulpayki.","Gracias.","Siempre"],["Paqarin·kama.","Hasta mañana.","Al despedirse"]],k:[0]},{c:"Kay · ser / estar",h:["Quechua","Español"],r:[["ñuqa kani","yo soy / estoy"],["qam kanki","tú eres / estás"],["pay kan","él o ella es / está"]],k:[0]}],
gn:["<b>-pas</b> = también: <i>ñuqa·pas</i> = yo también.","<b>-kama</b> = hasta: <i>paqarin·kama</i> = hasta mañana."],
oj:"✗ Decir solo «hola» → ✓ <i>Allillanchu?</i>: en los Andes se saluda preguntando por el bienestar.",
ej:[["Allillanchu, taytay?","¿Está bien, señor?"],["Ñuqapas allillanmi.","Yo también estoy bien."],["Sulpayki, mamay.","Gracias, señora."]],
p:[["¿Cómo saludas en quechua?","Allillanchu?"],["Responde: estoy bien.","Allillanmi."],["Di: gracias.","Sulpayki."],["Di: ¿y tú?","Qamrí?"],["Di: hasta mañana.","Paqarinkama."]],
tk:"Saluda en voz alta a 3 personas imaginarias (una señora, un señor y un amigo): pregunta Allillanchu?, responde, agradece y despídete.",
cu:"En los Andes saludar es muy importante: se saluda a todos en el camino, aunque no los conozcas. Llamar <i>mamay</i> o <i>taytay</i> a una persona mayor es una muestra de respeto."},

{t:"Presentarse · Ima sutiyki?",g:"Decir tu nombre, preguntar el nombre y conocer los sufijos -qa y -mi.",
w:[["suti","nombre"],["sutiy","mi nombre"],["sutiyki","tu nombre"],["ima","qué"],["ñuqa","yo"],["qam","tú / usted"],["pay","él / ella"],["kani","soy"],["runa","persona"],["warmi","mujer"],["qari","varón"],["kusikuni","me alegro"]],
f:[["Ima sutiyki?","¿Cómo te llamas?"],["Sutiymi Daniel.","Me llamo Daniel."],["Ñuqaqa Danielmi kani.","Yo soy Daniel."],["Qamqa Juanchu kanki?","¿Tú eres Juan?"],["Manam, ñuqaqa Carlosmi kani.","No, yo soy Carlos."],["Anchata kusikuni, Rosa.","Mucho gusto, Rosa (me alegro mucho)."]],
v:["riqsiy","conocer","Presente",PR("riqsi")],
c:[["Allillanchu! Ima sutiyki?","¡Hola! ¿Cómo te llamas?"],["Sutiymi Daniel. Qampa sutiykiri?","Me llamo Daniel. ¿Y tu nombre?"],["Ñuqaqa Rosam kani.","Yo soy Rosa."],["Anchata kusikuni, Rosa.","Mucho gusto, Rosa."],["Ñuqapas anchata kusikuni.","Yo también me alegro mucho."],["Paqarinkama, Rosa!","¡Hasta mañana, Rosa!"]],
n:"El nombre se dice con <b>-mi</b>: <i>Sutiymi Daniel</i>. El pedacito -mi significa «esto lo afirmo yo».",
s:{i:"Conoce la ñ y la q.",r:[["Ñ","Igual que en castellano: ñuqa","v"],["Q","Se dice con la garganta, más atrás que la k, y cambia la vocal vecina: ñuqa suena [ñoka]","a"]],f:[["ñ","ñuqa"],["q","ñuqaqa"],["s","suti"],["r","runa"],["w","warmi"],["q","qari"]]},
gt:"Los sufijos -qa (de quién hablo) y -mi (lo afirmo)",gi:"<p><b>Paso 1 · El quechua es como un lego.</b> A una palabra se le <b>pegan pedacitos al final</b>. Mira: <i>suti</i> = nombre → <i>suti·y</i> = mi nombre → <i>suti·yki</i> = tu nombre.</p><p><b>Paso 2 · -qa</b> marca de quién o de qué estás hablando: <i>ñuqa·qa</i> = en cuanto a mí, yo.</p><p><b>Paso 3 · -mi</b> afirma: lo dices seguro. Se pega a la palabra más importante: <i>Ñuqa·qa Daniel·mi kani</i>. Después de vocal se acorta a <b>-m</b>: <i>Rosa·m</i>.</p><p><b>Paso 4 · El verbo va al final.</b> En quechua se dice «Yo Daniel soy».</p>",
tb:[{c:"Pronombres",h:["Quechua","Español"],r:[["ñuqa","yo"],["qam","tú / usted"],["pay","él / ella"]],k:[0]},{c:"Pedacitos de hoy",h:["Pedazo","Qué hace","Ejemplo"],r:[["-qa","marca el tema","ñuqa·qa"],["-mi / -m","afirma","Daniel·mi, Rosa·m"],["-y","mi","suti·y"],["-yki","tu","suti·yki"]],k:[2]}],
gn:["<b>No hay «el / la»:</b> el quechua no tiene artículos ni masculino o femenino. <i>pay</i> = él o ella.","<b>Qam</b> sirve para «tú» y para «usted»."],
oj:"✗ Ñuqa kani Daniel → ✓ <i>Ñuqaqa Danielmi kani</i>: el verbo va al final.",
ej:[["Ñuqaqa Danielmi kani.","Yo soy Daniel."],["Payqa Rosam.","Ella es Rosa."],["Sutiymi Carlos.","Me llamo Carlos."]],
p:[["Pregunta: ¿Cómo te llamas?","Ima sutiyki?"],["Di: Me llamo Daniel.","Sutiymi Daniel."],["Di: Yo soy Daniel.","Ñuqaqa Danielmi kani."],["¿Qué significa pay?","~Él o ella: no hay diferencia."],["¿Por qué se dice Rosam y no Rosami?","~Después de vocal, -mi se acorta a -m."]],
tk:"Preséntate en voz alta: saluda, di tu nombre con Sutiymi… y con Ñuqaqa …mi kani, y pregunta el nombre a otra persona.",
cu:"Muchos apellidos peruanos vienen del quechua: Quispe (<i>qispi</i> = libre), Huamán (<i>waman</i> = halcón), Condori (<i>kuntur</i> = cóndor) y Cori (<i>quri</i> = oro)."},

{t:"¿De dónde eres? · -manta",g:"Decir de dónde eres y dónde vives con -manta (de) y -pi (en).",
w:[["may","dónde"],["maymanta","de dónde"],["llaqta","pueblo, ciudad"],["tiyani","vivo"],["kunan","ahora, hoy"],["urqu","cerro"],["mayu","río"],["qucha","laguna"],["hatun","grande"],["huchuy","pequeño"],["sumaq","bonito, rico"],["ñuqataq","y yo"]],
f:[["Maymantam kanki?","¿De dónde eres?"],["Ñuqaqa Ayacuchomantam kani.","Yo soy de Ayacucho."],["Kunanqa Limapim tiyani.","Ahora vivo en Lima."],["Maypim tiyanki?","¿Dónde vives?"],["Chimboteqa hatun llaqtam.","Chimbote es una ciudad grande."],["Llaqtayqa huchuy, ichaqa sumaqmi.","Mi pueblo es pequeño, pero bonito."]],
v:["tiyay","vivir / sentarse","Presente",PR("tiya")],
c:[["Maymantam kanki, Daniel?","¿De dónde eres, Daniel?"],["Chimbotemantam kani. Qamrí?","Soy de Chimbote. ¿Y tú?"],["Ñuqaqa Ayacuchomantam kani.","Yo soy de Ayacucho."],["Ayacuchoqa sumaq llaqtam!","¡Ayacucho es una ciudad bonita!"],["Arí. Kunanqa Limapim tiyani.","Sí. Ahora vivo en Lima."],["Ñuqataq Chimbotepim tiyani.","Y yo vivo en Chimbote."]],
n:"<b>-manta</b> significa «de, desde»: <i>Ayacucho·manta</i> = de Ayacucho. <b>-pi</b> significa «en»: <i>Lima·pi</i> = en Lima.",
s:{i:"La ll y la q con u.",r:[["LL","Como la ll de la sierra, con la lengua en el paladar: llaqta","v"],["Q + u","qucha suena [kocha]: la u al lado de la q suena «o»","a"]],f:[["ll","llaqta"],["q","qucha"],["q","urqu"],["y","may"],["m","maymanta"],["ch","huchuy"]]},

const SKIP=new Set(["daniel","rosa","juan","carlos","ana","lima","cusco","ayacucho","chimbote","huamanga","huancayo","perú","peru","kilo","soles","sol","puka"]);
const ACC={a:"á",e:"é",i:"í",o:"ó",u:"ú"};
function qword(w){if(SKIP.has(w))return w;let s=w;
  s=s.replace(/q([iu])/g,(m,v)=>"q"+(v==="i"?"e":"o")).replace(/[iu](?=(?:ll|ch|[^aeiouq])?q)/g,v=>v==="i"?"e":"o");
  const ix=[];for(let i=0;i<s.length;i++)if("aeiou".includes(s[i]))ix.push(i);
  if(ix.length>1&&!"aeiouns".includes(s[s.length-1])&&!/[áéíóú]/.test(s)){const k=ix[ix.length-2];s=s.slice(0,k)+ACC[s[k]]+s.slice(k+1)}
  return s.replace(/q/g,"k").replace(/(^|[^c])h/g,"$1j").replace(/w/g,"u")}
const qpron=t=>String(t).replace(/·/g,"").replace(/[a-zA-ZñÑáéíóúÁÉÍÓÚ]+/g,w=>{const l=w.toLowerCase(),r=qword(l);return w[0]!==l[0]?r[0].toUpperCase()+r.slice(1):r});
const cz=s=>String(s).replace(/[A-Za-zñÑáéíóúÁÉÍÓÚ¡¿?!.\-]*·[A-Za-zñÑáéíóúÁÉÍÓÚ·?!.\-]*/g,w=>w.split("·").map((p,i)=>`<span class="m${i?Math.min(i,3):0}">${p}</span>`).join('<span class="md">·</span>'));

const FEM=/paulina|m[oó]nica|helena|elvira|dalia|camila|sabina|laura|paloma|lupe|elena|marisol|valentina|ximena|catalina|salom|luc[ií]a|carmen|isabel|estrella|francisca|renata|sof[ií]a|esperanza|female|mujer|google espa/i;
const MAS=/jorge|pablo|diego|ra[uú]l|[aá]lvaro|carlos|enrique|juan|andr[eé]s|gonzalo|tom[aá]s|jos[eé]|alex|mateo|federico|gerardo|alonso|\bmale|hombre/i;
function vScore(v){let s=0;if(FEM.test(v.name))s+=50;if(MAS.test(v.name))s-=60;if(/natural|online|neural/i.test(v.name))s+=20;if(/google/i.test(v.name))s+=10;
  if(/es[-_]pe/i.test(v.lang))s+=8;else if(/es[-_](us|mx|419|co)/i.test(v.lang))s+=6;else if(/es[-_]es/i.test(v.lang))s+=2;return s}
function pickVoice(){try{const all=speechSynthesis.getVoices()||[];NALL=all.length;VOICES=all.filter(v=>v.lang&&/^es/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a));
  let sv=null;try{sv=localStorage.getItem("qu30voice")}catch(e){}voice=VOICES.find(v=>v.name===sv)||VOICES[0]||null;
  const s=document.getElementById("vsel");if(s)s.innerHTML=vOpts()}catch(e){}}
const vOpts=()=>VOICES.map((v,i)=>`<option value="${i}"${v===voice?" selected":""}>${v.name}${i===0?" · recomendada":""}</option>`).join("")||"<option>Español del sistema</option>";
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}

function setVoice(i){voice=VOICES[+i]||null;try{localStorage.setItem("qu30voice",voice?voice.name:"")}catch(e){}say("Allillanchu! Rimaykullayki.")}

function utt(t,r){const u=new SpeechSynthesisUtterance(t);if(voice){u.voice=voice;u.lang=String(voice.lang).replace("_","-")}else u.lang="es-US";
  u.rate=r;u.pitch=voice&&FEM.test(voice.name)?1:1.12;return u}

let AU=null,TTSOK=true;
function callar(){try{speechSynthesis.cancel()}catch(e){}if(AU){try{AU.onended=AU.onerror=null;AU.pause()}catch(e){}AU=null}}
function hablarSys(t,r,fin){try{if(!voice)pickVoice();sinEs();const u=utt(t,r);if(fin)u.onend=fin;setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},60)}catch(e){if(fin)fin()}}
function hablar(t,r,fin){callar();
  if(TTSOK&&navigator.onLine!==false&&t.length<190){const a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q="+encodeURIComponent(t));AU=a;
    try{a.defaultPlaybackRate=a.playbackRate=Math.max(0.5,Math.min(1,r));a.preservesPitch=true}catch(e){}
    a.onended=()=>{if(AU===a)AU=null;if(fin)fin()};
    a.onerror=()=>{if(AU!==a)return;AU=null;TTSOK=false;hablarSys(t,r,fin)};
    a.play().catch(()=>{if(AU!==a)return;AU=null;hablarSys(t,r,fin)});return}
  hablarSys(t,r,fin)}
function speak(t,r){hablar(t,r)}

// ---------- comparar respuestas ----------
const norm=s=>String(s).toLowerCase().replace(/ñ/g,"\u0001").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\u0001/g,"ñ").replace(/·/g,"").replace(/[^a-zñ' ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const wsim=(a,b)=>!a||!b?0:1-lev(a,b)/Math.max(a.length,b.length);
const wds=s=>norm(s).split(" ").filter(Boolean);
const WT=0.85;
function wordChips(heard,target){const H=wds(heard),ws=target.split(/\s+/).filter(w=>norm(w));let n=0;
  const ch=ws.map(w=>{const ok=wds(w).every(p=>H.some(h=>wsim(h,p)>=WT));if(ok)n++;return `<span class="chip ${ok?"ok":"bad"}">${w.replace(/[.,!?;:¿¡]/g,"")} ${ok?"✓":"✗"}</span>`}).join("");
  return {n,t:ws.length,html:`<div class="wres"><small>TU RESPUESTA, PALABRA POR PALABRA · ${n} de ${ws.length} bien</small><div class="chips">${ch}</div></div>`}}

let MR=null,MYURL=null,RC=null;
const canRec=()=>!!(window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
function recBox(id,text,cb){RC={text,cb};const b=sec(id);if(!b)return;
  b.innerHTML=canRec()?`<button class="micb" id="rb" onclick="recToggle()">🎙️ Grábate diciéndolo</button><div id="rr" style="margin-top:10px"></div>`:`<p class="hint" style="text-align:center">Dilo en voz alta 3 veces, igual que el modelo 🔊, y califícate:</p><div id="rr"></div>`;
  if(!canRec())rateUI()}
async function recToggle(){if(MR&&MR.state==="recording"){MR.stop();return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("No pude usar el micrófono. Revisa el permiso del navegador (el candado junto a la dirección de la página).");return}
  callar();
  const ch=[],rec=new MediaRecorder(st);MR=rec;rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());if(MYURL)URL.revokeObjectURL(MYURL);MYURL=URL.createObjectURL(new Blob(ch,{type:rec.mimeType||"audio/webm"}));MR=null;
    const b=sec("rb");if(b){b.className="micb";b.textContent="🎙️ Grabarme otra vez"}rateUI();playMine()};
  rec.start();const b=sec("rb");if(b){b.className="micb on";b.innerHTML='<span class="wv"><i></i><i></i><i></i><i></i></span> Grabando… toca para terminar'}
  setTimeout(()=>{if(rec.state==="recording")rec.stop()},10000)}
function playMine(){if(MYURL)try{new Audio(MYURL).play()}catch(e){}}
function rateUI(){const r=sec("rr");if(!r||!RC)return;
  r.innerHTML=`${canRec()?`<div class="row" style="justify-content:center"><button class="btn" onclick="playMine()">▶ Mi voz</button><button class="btn" onclick="say(RC.text)">🔊 Modelo</button><button class="btn" onclick="say(RC.text,1)">🐢 Lento</button></div>`:`<div class="row" style="justify-content:center"><button class="btn" onclick="say(RC.text)">🔊 Modelo</button><button class="btn" onclick="say(RC.text,1)">🐢 Lento</button></div>`}

  if(ex){ex();document.querySelectorAll("[data-ex]").forEach(b=>b.classList.toggle("on",b.dataset.ex===m));goTo("s-ex")}
  else if(m){const id={sonido:"s-sonido",aprender:"s-aprender",gramatica:"s-gram",verbo:"s-verbo",conversacion:"s-conv",practica:"s-prac"}[m];if(id)goTo(id)}
  else scrollTo(0,0)}

function claves(ns,oj){const ex=t=>{const m=t.match(/<i>(.*?)<\/i>/);return m?m[1].replace(/<[^>]+>/g,"").replace(/·/g,""):""};

  return `<p class="lbl">🔑 Claves del día</p>${ns.map((n,i)=>{const m=n.match(/^<b>([^<]+):<\/b>\s*/);return card(i?"b":"v","🔑 Clave"+(m?": "+m[1]:""),m?n.slice(m[0].length):n)}).join("")}${card("a","⚠️ Ojo: error típico",oj)}`}

const srv=(fn,...a)=>GAS?new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a))

function showLogin(msg){view="login";

  <form style="padding:24px" onsubmit="event.preventDefault();doLogin()">
   <div style="text-align:center;margin-bottom:18px"><div style="width:56px;height:56px;border-radius:50%;background:#fff3d6;display:inline-flex;align-items:center;justify-content:center;font-size:28px">🏔️</div>
   <h2 style="margin:8px 0 2px">Quechua en 30 días</h2><p class="mut" style="margin:0">Yaykumuy! Ingresa para ver tu avance</p></div>

  </form></div></div>`;
  setTimeout(()=>sec("lu").focus(),50)}
async function doLogin(){const u=sec("lu").value.trim(),p=sec("lp").value,r=sec("lr").checked,m=sec("lm"),b=sec("lb");
  if(!u||(GS&&!p)){m.textContent="Escribe tu usuario y contraseña.";return}
  if(!GS){if(r)LS.set("qu30user",u);entrar({u,nombre:u,avance:null},null);return}
  b.textContent="Verificando…";b.disabled=true;
  try{const x=await srv("login",u,p);if(x&&x.ok){if(r)LS.set("qu30tk",x.token);entrar(x,x.token)}else{m.textContent=x.msg||"Usuario o contraseña incorrectos";b.textContent="Ingresar";b.disabled=false}}
  catch(e){m.textContent="No hay conexión con el servidor. Intenta otra vez.";b.textContent="Ingresar";b.disabled=false}}
let SQ=[],SQT=null,SQD=0,SQB=false;
const qKey=()=>"qu30q_"+(USER?USER.u:"");
function qLoad(){try{SQ=JSON.parse(LS.get(qKey())||"[]")}catch(e){SQ=[]}}
function qSave(){if(USER)LS.set(qKey(),JSON.stringify(SQ))}
const merge=a=>{if(a)Object.keys(a).forEach(k=>{if(!done[k]||a[k]>done[k])done[k]=a[k]});save()};
function entrar(r,tk){USER={u:r.u,n:r.nombre};MAXD=GS?Math.max(1,Math.min(ND,Number(r.maxDia)||1)):ND;errLoad();TOKEN=tk;let loc={};try{loc=JSON.parse(LS.get("qu30_"+r.u)||"{}")}catch(e){}done=loc;merge(r.avance);qLoad();setTimeout(sync,1500);
  if(!Object.keys(done).length&&!LS.get("qu30intro_"+r.u))intro();else home();welcome()}
function logout(){clearTimeout(SQT);SQ=[];if(GS&&TOKEN)srv("logout",TOKEN).catch(()=>{});LS.del("qu30tk");LS.del("qu30user");USER=null;TOKEN=null;done={};showLogin()}
async function start(){const tk=LS.get("qu30tk");
  if(GS&&tk){app.innerHTML=`<p class="mut" style="text-align:center;padding:60px">Cargando…</p>`;try{const r=await srv("sesion",tk);if(r&&r.ok){entrar(r,tk);return}LS.del("qu30tk")}catch(e){app.innerHTML=`<p class="mut" style="text-align:center;padding:60px">📶 Sin conexión. Reintentando…</p>`;setTimeout(start,5000);return}}
  if(!GS){const u=LS.get("qu30user");if(u){entrar({u,nombre:u,avance:null},null);return}}
  showLogin()}
function registrar(pct){if(pct>=70&&(!done[cur]||pct>done[cur]))done[cur]=pct;save();
  if(GS&&TOKEN){SQ.push([cur+1,D[cur].t,q.ok,q.items.length]);qSave();SQD=0;sync()}}
async function sync(){clearTimeout(SQT);SQT=null;if(!GS||!TOKEN||!SQ.length||SQB)return;SQB=true;const tk=TOKEN;
  try{while(SQ.length&&TOKEN===tk){const r=await srv("guardarDia",tk,...SQ[0]);
      if(r&&r.ok){SQ.shift();qSave();merge(r.avance)}
      else if(r&&r.msg==="bloqueado"){SQ.shift();qSave()}
      else if(r&&r.msg==="sesion"){SQB=false;toast("Tu sesión expiró. Ingresa de nuevo para terminar de guardar tu avance.");logout();return}
      else throw 0}
    SQD=0}
  catch(e){SQD=Math.min(SQD+1,6);SQT=setTimeout(sync,[5,30,60,120,300,600][SQD-1]*1000)}
  SQB=false}
window.addEventListener("online",()=>{SQD=0;sync()});

const INTRO=[

["🗣️ La Q: el sonido estrella","La <b>q</b> se dice con la garganta, más atrás que la k. Y cambia las vocales vecinas: la <b>i</b> suena «e» y la <b>u</b> suena «o». Por eso <i>qillu</i> se oye [kellu].",[["qillu","amarillo"],["urqu","cerro"],["qucha","laguna"]]],
["💨 La H suave","La <b>h</b> no es muda como en castellano: suena como una j muy suave, solo aire.",[["hatun","grande"],["hamuy","venir"],["haqay","aquel"]]],
["🎯 El acento: en la penúltima","La fuerza de la voz va casi siempre en la penúltima sílaba, aunque la palabra crezca: WA-si → wa-SI-cha → wa-si-CHA-pi.",[["wasi","casa"],["wasicha","casita"],["wasichapi","en la casita"]]],

// ---------- repaso ----------
function repaso(){view="repaso";const dias=Object.keys(done).map(Number),src=dias.length?dias:[...Array(nextDay()+1).keys()];
  q={items:shuf(src.flatMap(i=>D[i].w.concat(D[i].f.slice(0,2)))).slice(0,15),k:0,ok:0,again:[]};nextR()}

  const x=q.items[q.k];
  app.innerHTML=`<button class="btn sm" onclick="home()">← Plan</button><h1>🧠 Repaso rápido</h1><p class="sub">Tarjetas de los días que ya aprobaste. Tarjeta ${q.k+1}/${q.items.length}</p>
